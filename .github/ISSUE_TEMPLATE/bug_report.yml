name: Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report issues in the Node.js core or WebUI. Archived Python modules are not connected.
        Never include bot tokens, cookies, initData, authorization codes, or raw configuration files.

  - type: input
    id: module-name
    attributes:
      label: Component
      description: Which native component has the issue?
      placeholder: e.g. core, Telegram commands, WebUI, authentication
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: Node.js Version
      description: The Node.js 24 version used by the runtime
      placeholder: e.g. 24.22.2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe what's happening and what you expected instead
      placeholder: When I use the command, X happens instead of Y...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to Reproduce
      description: Steps to reproduce the behavior
      placeholder: How can we reproduce this issue?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: How are you running the bot?
      options:
        - Docker
        - Docker Compose
        - Node.js / npm
        - Other
    validations:
      required: true

  - type: input
    id: bot-version
    attributes:
      label: Bot Version
      description: Version or commit hash of the bot
      placeholder: e.g. v1.0.0 or commit hash like 7a2d3f5
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Add only sanitized logs or screenshots, with all credentials and personal data removed
      render: shell
