name: misaka-core
services:
  misaka:
    build: .
    image: misaka-core:local
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      MISAKA_BOT_TOKEN: ${MISAKA_BOT_TOKEN:?Provide a separate test bot token}
      MISAKA_ADMIN_IDS: ${MISAKA_ADMIN_IDS:?Provide configured superadministrator IDs}
      MISAKA_DATA_DIR: /app/data/misaka
      MISAKA_LOG_LEVEL: ${MISAKA_LOG_LEVEL:-INFO}
      MISAKA_POLLING_TIMEOUT: ${MISAKA_POLLING_TIMEOUT:-30}
      MISAKA_REQUEST_TIMEOUT: ${MISAKA_REQUEST_TIMEOUT:-60}
      MISAKA_DROP_PENDING_UPDATES: ${MISAKA_DROP_PENDING_UPDATES:-false}
      MISAKA_WEB_ENABLED: ${MISAKA_WEB_ENABLED:-false}
      MISAKA_WEB_HOST: 0.0.0.0
      MISAKA_WEB_PORT: ${MISAKA_WEB_PORT:-8080}
      MISAKA_PUBLIC_BASE_URL: ${MISAKA_PUBLIC_BASE_URL:-}
      MISAKA_OIDC_CLIENT_ID: ${MISAKA_OIDC_CLIENT_ID:-}
      MISAKA_OIDC_CLIENT_SECRET: ${MISAKA_OIDC_CLIENT_SECRET:-}
      MISAKA_EXCHANGE_RATE_API_KEY: ${MISAKA_EXCHANGE_RATE_API_KEY:-}
      MISAKA_QWEATHER_API_KEY: ${MISAKA_QWEATHER_API_KEY:-}
      MISAKA_QWEATHER_API_HOST: ${MISAKA_QWEATHER_API_HOST:-}
      MISAKA_OPENWEATHER_API_KEY: ${MISAKA_OPENWEATHER_API_KEY:-}
      MISAKA_OPEN_METEO_ENABLED: ${MISAKA_OPEN_METEO_ENABLED:-true}
    ports:
      - "127.0.0.1:${MISAKA_WEB_PORT:-8080}:${MISAKA_WEB_PORT:-8080}"
    volumes:
      - core_data:/app/data/misaka

volumes:
  core_data:
